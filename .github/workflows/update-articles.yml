name: 每日更新经济学人文章

on:
  schedule:
    # 每天北京时间 06:17（UTC 22:17）抓取最新文章
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 抓取最新文章
        run: python3 scripts/fetch_articles.py

      - name: 有新内容才提交
        run: |
          if git diff --quiet data/articles.json; then
            echo "无新文章，跳过提交"
          else
            git config user.name "daily-bot"
            git config user.email "244891061+gaobiebie-coder@users.noreply.github.com"
            git add data/articles.json
            git commit -m "📰 每日更新经济学人文章 $(date -u +%Y-%m-%d)"
            git push
          fi
