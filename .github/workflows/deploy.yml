name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 把本次提交的哈希写进 sw.js 版本号，
      # 保证每次部署都会生成新的 Service Worker，触发浏览器后台更新
      - name: 注入版本号
        run: sed -i "s/__VERSION__/${{ github.sha }}/" sw.js

      - name: 打包站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
