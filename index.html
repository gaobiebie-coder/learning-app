<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>每日学习</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 首页 -->
  <section class="page active" id="page-home">
    <header class="page-header">
      <h1>你好，同学 👋</h1>
      <p class="sub">今天也要坚持学习哦</p>
    </header>

    <div class="card">
      <h2>今日目标</h2>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <p id="progress-text">已学 0 / 20 个单词</p>
    </div>

    <div class="card word-card" id="word-card">
      <div id="word-front">
        <div class="word" id="word-text">persistence</div>
        <div class="hint">点击查看释义</div>
      </div>
      <div id="word-back" class="hidden">
        <div class="meaning" id="meaning-text"></div>
        <div class="example" id="example-text"></div>
      </div>
    </div>

    <button class="btn primary" id="btn-next">学会了，下一个</button>
  </section>

  <!-- 阅读页：经济学人 -->
  <section class="page" id="page-reading">
    <header class="page-header">
      <h1>经济学人 · 每日精读</h1>
      <p class="sub" id="reading-updated">加载中…</p>
    </header>

    <div id="today-card"></div>

    <h2 class="section-title">目录</h2>
    <div class="chips" id="section-chips"></div>
    <div id="article-list"></div>

    <!-- 文章详情浮层 -->
    <div class="overlay hidden" id="reader">
      <div class="overlay-panel">
        <button class="overlay-close" id="reader-close">✕</button>
        <div id="reader-content"></div>
      </div>
    </div>
  </section>

  <!-- 书架页：本地 epub 阅读器 -->
  <section class="page" id="page-library">
    <header class="page-header">
      <h1>书架</h1>
      <p class="sub">epub 只保存在本机，离线阅读，点词翻译</p>
    </header>
    <button class="btn primary" id="btn-import">＋ 导入 epub 电子书</button>
    <input type="file" id="file-input" accept=".epub" class="hidden">
    <div class="book-grid" id="book-grid"></div>

    <!-- 读书浮层 -->
    <div class="overlay hidden" id="book-overlay">
      <div class="overlay-panel book-panel">
        <button class="overlay-close" id="book-close">✕</button>
        <div class="book-header">
          <div class="book-title" id="book-title"></div>
          <div class="book-chapter-info" id="book-chapter-info"></div>
        </div>
        <div class="book-content" id="book-content"></div>
        <div class="book-nav">
          <button class="btn" id="book-prev">← 上一章</button>
          <button class="btn" id="book-next">下一章 →</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 学习页 -->
  <section class="page" id="page-study">
    <header class="page-header"><h1>学习模块</h1></header>
    <div class="card list-item" id="vocab-card"><span class="icon">📒</span><div><b>生词本</b><p id="vocab-count">阅读查词自动收藏</p></div><span class="chev">›</span></div>
    <div class="card list-item" id="ielts-card"><span class="icon">🔤</span><div><b>雅思核心词</b><p>4000 词 · 按词频排序</p></div><span class="chev">›</span></div>
    <div class="card list-item" id="econ-card"><span class="icon">📰</span><div><b>经济学人</b><p>每日精读一篇</p></div><span class="chev">›</span></div>

    <!-- 生词本浮层 -->
    <div class="overlay hidden" id="vocab-overlay">
      <div class="overlay-panel">
        <button class="overlay-close" id="vocab-close">✕</button>
        <h2 class="section-title">📒 生词本</h2>
        <p class="hint">查过的单词会自动加入首页单词卡循环复习</p>
        <div id="vocab-list"></div>
      </div>
    </div>

    <!-- 雅思词库浮层 -->
    <div class="overlay hidden" id="ielts-overlay">
      <div class="overlay-panel">
        <button class="overlay-close" id="ielts-close">✕</button>
        <h2 class="section-title">🔤 雅思核心 4000 词</h2>
        <input class="ielts-search" id="ielts-search" type="search" placeholder="搜索单词…">
        <div id="ielts-list"></div>
      </div>
    </div>
  </section>

  <!-- 我的 -->
  <section class="page" id="page-me">
    <header class="page-header"><h1>我的</h1></header>
    <div class="card checkin-card">
      <h2>连续学习</h2>
      <div class="streak" id="streak-days">0 天</div>
      <button class="btn primary" id="btn-checkin">打卡</button>
    </div>
  </section>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <button class="tab active" data-page="home">🏠<span>首页</span></button>
    <button class="tab" data-page="reading">📰<span>阅读</span></button>
    <button class="tab" data-page="library">📖<span>书架</span></button>
    <button class="tab" data-page="study">📚<span>学习</span></button>
    <button class="tab" data-page="me">👤<span>我的</span></button>
  </nav>

  <!-- 词典弹窗（全局，阅读页和书架共用） -->
  <div class="dict-popup hidden" id="dict-popup"></div>

  <script src="vendor/jszip.min.js"></script>
  <script src="app.js"></script>
  <script src="reading.js"></script>
  <script src="vocab.js"></script>
  <script src="ielts.js"></script>
  <script src="library.js"></script>
</body>
</html>
